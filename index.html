一款马上开炸！`,createdAt:Date.now()},{id:K(),category:`开场`,title:`非遗背书+身份介绍`,content:`瓷友们好，我是主播小钧。咱们家在神垕做了三十多年钧瓷，老爷子是**省级非遗传承人**，今天所有上的器物，都是自家窑口**柴烧/煤烧原矿釉**，每一件底部都有大师手签款+收藏证书，保真不踩坑。`,createdAt:Date.now()},{id:K(),category:`开场`,title:`灯牌福利开场`,content:`加个粉丝灯牌一毛钱，今天**灯牌等级 ≥ 3 的瓷友**，下单随单送一只价值 68 元的**钧瓷茶宠**，长期在咱们家蹲的，福利都不会让你白等！`,createdAt:Date.now()},{id:K(),category:`讲解`,title:`窑变唯一性讲解`,content:`瓷友们看这只杯子——注意这个釉面：**紫里泛红，红里透紫，釉上有金斑**。我把镜头拉进点看细节：（镜头特写）这不是后期画上去的，也不是喷的釉，是**1300 度高温下自然流动**形成的。钧瓷无双，窑变无对，今天你拍这只，世界上就再也找不到第二只一模一样的。`,createdAt:Date.now()},{id:K(),category:`讲解`,title:`蚯蚓走泥纹+开片讲解`,content:`懂行的瓷友看这里——杯身上这条一条一条若隐若现的线，这叫**「蚯蚓走泥纹」**，是老钧才有的特征，是釉在高温下开裂又自然愈合形成的。还有这细密的开片，（敲声）听见没？**"叮当"瓷音清越**，这就是老胎老釉的声音，你拿回去养茶，开片会慢慢浸出金丝铁线，越养越润。`,createdAt:Date.now()},{id:K(),category:`讲解`,title:`柴烧 vs 气烧对比`,content:`咱们这窑是**柴烧 3 天 3 夜**，用的是当地松木。柴烧的好处是什么？——木灰会自然落釉，形成这种温润的**"橘皮釉"**，手摸上去有颗粒感，像婴儿皮肤一样细腻。气烧只要 10 小时，釉面是死的、玻璃感的，柴烧是活的，越用越有灵气，这就是为什么老玩家都追柴烧。`,createdAt:Date.now()},{id:K(),category:`讲解`,title:`大师落款 + 收藏证书`,content:`翻过来看底足——（镜头翻底）这是**国家级大师 XXX 的手签款**，旁边还有窑口的火漆印。随单配套：**一对一收藏证书 + 非遗授权书 + 专属编号**，支持全国复检，假一赔十，传到下一代都能保值。`,createdAt:Date.now()},{id:K(),category:`讲解`,title:`器型讲解（主人杯/茶器）`,content:`这只叫**"罗汉杯"**，口沿外撇，杯腹饱满，落手非常压手，刚好一拳握。内壁是天青色，外壁窑变玫瑰紫，一器两釉，**"外紫里青"**，喝茶不串味，观茶色清清楚楚。懂器型的朋友知道，罗汉杯最考验修坯师傅的手，稍微歪一点就塌了，这只合格率不到三分之一。`,createdAt:Date.now()},{id:K(),category:`讲解`,title:`花瓶/摆件讲解`,content:`这只**"双龙耳赏瓶"**，高 38 公分，器型仿宋钧。重点看肩部这两道窑变——**"雨过天青泛红霞"**，古人说"红为贵，紫为最，天青天白惹人爱"，这一只既有红又有紫还带天青，三色齐聚，属于**窑变上品**，摆在家里玄关、书房，聚财纳福。`,createdAt:Date.now()},{id:K(),category:`逼单`,title:`孤品/唯一性逼单`,content:`家人们记住，钧瓷**没有"补货"两个字**。这一窑出了 120 只，挑出来只有 17 只能入直播间，有瑕疵的我们全砸了。（背景砸瓷声做氛围）拍到就是缘分，**下一次再出这个釉色，可能要等半年甚至一年**。`,createdAt:Date.now()},{id:K(),category:`逼单`,title:`限时+赠品逼单`,content:`倒计时 5 分钟！5 分钟内下单的，额外赠：1️⃣ 同釉色**茶漏一只**（价值 88）；2️⃣ **养壶巾 + 钧瓷鉴定手册**；3️⃣ 顺丰木箱**破损包赔**。5 分钟后只赠证书，赠品全部收回，来，准备上车！`,createdAt:Date.now()},{id:K(),category:`逼单`,title:`价格锚点对比`,content:`这只罗汉杯，**窑口给经销商批发价 280，文玩店零售价 680，直播间今天：不要 280，不要 180——128 一只包邮！** 我就问你，128 你买个普通德化白瓷主人杯都不止这个价，这是**非遗大师柴烧钧瓷**，闭眼入。`,createdAt:Date.now()},{id:K(),category:`互动`,title:`扣字看釉色`,content:`瓷友们！喜欢玫瑰紫的扣「1」，喜欢天青色的扣「2」，喜欢月白的扣「3」，扣得多的釉色我先上链接，扣得少的咱们就压后，来，弹幕走起来！`,createdAt:Date.now()},{id:K(),category:`互动`,title:`点赞+关注任务`,content:`帮主播把赞点到 **5 万**，点到 5 万我**免费抽一只钧瓷茶宠**，灯牌等级 1 级以上就能参与。点赞不用花钱，就当帮主播冲冲流量，感谢瓷友们！`,createdAt:Date.now()},{id:K(),category:`互动`,title:`分享抽奖`,content:`把直播间**分享到朋友圈/茶友群**，截图发给后台客服，今晚 10 点抽一位瓷友，**免费送价值 398 的柴烧公道杯一只**！截图保留好，客服会核对。`,createdAt:Date.now()},{id:K(),category:`答疑`,title:`回答"真假/是否化工釉"`,content:`瓷友放心，咱们家**百分百原矿釉**，用的是禹州本地神垕的孔雀石、方解石、紫金土，没有一滴化学色料。你拿回去用开水煮、用紫外线灯照，**如果褪色、如果析出，直接十倍赔款**。支持任何机构检测，假一赔十。`,createdAt:Date.now()},{id:K(),category:`答疑`,title:`回答"怎么养/怎么开片"`,content:`钧瓷不用特意"开片养"——你就正常用它喝茶，**红茶、普洱、熟普最佳**，茶汤的茶色会慢慢渗进开片里，形成"金丝铁线"。半年左右你再看，每一条纹路里都有茶渍，那就是你和这只杯子共同的记忆，独一无二。`,createdAt:Date.now()},{id:K(),category:`答疑`,title:`回答"发货/包装/破损"`,content:`下单后**48 小时内顺丰发货**，全部用**定制木箱 + 珍珠棉**打包，保价 5000。签收时录开箱视频，**只要破了、裂了、釉面有瑕疵不满意，不用退，直接补发 + 额外赔 20%**，瓷友零风险。`,createdAt:Date.now()},{id:K(),category:`答疑`,title:`回答"能放微波炉/洗碗机吗"`,content:`钧瓷耐 1300 度高温，**热水、热茶完全没问题，但不建议微波炉和洗碗机**——不是怕裂，是怕金属餐具和洗碗机的碱把釉面磨花了。好器要善待，手洗一下也就 30 秒的事。`,createdAt:Date.now()},{id:K(),category:`答疑`,title:`回答"两只颜色不一样"`,content:`这正是钧瓷最值钱的地方！**"钧无双，窑无对"**——同一窑、同一釉料、同一个位置出的两只，釉色也一定有差别。收到货你要是发现和直播间"一模一样"，那才是假货。你那只是老天爷给你的专属釉色，别人有钱也买不到。`,createdAt:Date.now()},{id:K(),category:`留人`,title:`压箱底悬念留人`,content:`别走！**最后一款我本来不想上的——老爷子 10 年前封窑时留的柴烧赏瓶**，当年没舍得卖，现在市场价已经过万了，今天给老粉做个**"传承款"**，只放 3 只，价格你们绝对不敢想，3 分钟后回来，错过拍大腿！`,createdAt:Date.now()},{id:K(),category:`留人`,title:`整点福袋留人`,content:`还有 8 分钟到**整点**，整点我放 3 个福袋：一等奖是**价值 680 的柴烧盖碗**一套，二等奖是主人杯 2 只，三等奖是茶宠 5 个。**不点关注、不加灯牌**中了不算，现在加还来得及，等我数 100 个数就上福袋。`,createdAt:Date.now()},{id:K(),category:`留人`,title:`过款节奏留人`,content:`别急着划走！这款过了之后，**下一款是今天唯一一件"煤烧"作品**——煤烧现在环保不让烧了，市面上一件难求，懂的人都在蹲。**"一煤顶三柴"**，你在外面花 3 只柴烧的钱，今天直播间一只煤烧拿下，3 分钟后上，蹲住！`,createdAt:Date.now()},{id:K(),category:`过款`,title:`优雅过款 · 到链接`,content:`好，这只拍到的瓷友扣"**已拍+釉色**"，让我看看多少有缘人。没拍到的也别遗憾，接下来这只——你们一直在公屏上问的**"龙首壶 醒来之后，徽宗茶饭不思，把管窑的官员叫来：「朕要一种瓷，颜色就像雨过天晴云破处。烧不出来，拿你是问。」

官员跑遍全国，最后到了河南禹州神垕镇。这里的窑工试了上百种矿石，烧了上千只，终于有一天开窑——满窑的瓷器，釉面上泛着徽宗梦里那种颜色，紫中泛红，红中透青，每一只都不一样。

徽宗看到后龙颜大悦，赐名"钧瓷"，列为御用，民间不许用。从此就有了那句话——"黄金有价钧无价"，"家有万贯不如钧瓷一片"。

瓷友们，你现在手里端着的这只杯子，烧的就是一千年前那个皇帝梦里的颜色。这不是一件瓷器，这是一段历史。`],[`入窑一色·出窑万彩`,`文化故事`,[`窑变`,`经典`,`必讲`],`为什么全世界只有钧瓷能做到"一窑万彩"`,`很多新进直播间的瓷友问：为什么你们钧瓷每一只颜色都不一样？今天我给大家讲讲。

你看到的这只杯子，在进窑之前——注意——是素色的，灰扑扑的，所有的杯子一模一样，没有任何区别。

但是经过 1300 度高温，烧上三天三夜，出来的时候，每一只都不一样了。为什么？

因为钧瓷用的是天然原矿釉，釉里的铜元素在高温下会"流"。你想象一下，把一锅颜料烧开，它会自己流动、自己晕染，就像泼墨山水一样。哪个地方多流一点，哪个地方少流一点，出来的颜色就完全不同。

这就叫"入窑一色，出窑万彩"。全世界所有的瓷器，青花、粉彩、白瓷、黑釉，都是画什么就是什么，只有钧瓷，是老天爷的手笔。你买到的每一只，都是世界上独一无二的。`],[`一窑生·一窑死`,`窑口故事`,[`柴烧`,`开窑`,`悬念`],`开窑那一刻，是天堂还是地狱`,`给大家讲讲我们窑口真实的故事。

去年冬天，老爷子憋了一整年，要做一批柴烧赏瓶。松木拉了三卡车，窑工七个人，整整烧了三天三夜没有合眼。

到第四天早上开窑——这是整个窑口最紧张的时刻。所有人站在窑门口，老爷子亲自拿火钳开窑门。

烟散了，老爷子一只一只往外拿。第一只，釉面缩了，废了。第二只，变形了，废了。第三只……第四只……

七个人三天三夜，出了 80 只坯子，开窑之后能用的只有 11 只。剩下的 69 只，全部砸掉。听到没有？全部砸掉。不是便宜卖，不是当次品处理，是当着所有人的面砸碎。

因为钧瓷的规矩就是——"一窑生，一窑死"。好的就是好的，差的一只不留。这 11 只，每一只都是百里挑一的。你今天在直播间看到的，就是这 11 只里的。`],[`蚯蚓走泥纹的秘密`,`鉴赏故事`,[`开片`,`老钧`,`鉴定`],`一条线看懂老钧和新仿的区别`,`瓷友们，今天教你们一招，以后买钧瓷不会被坑。

你看这只杯子，上面有一条一条弯弯曲曲、像蚯蚓爬过泥地一样的纹路。这个纹路有个名字，叫"蚯蚓走泥纹"。

为什么会有这个纹路？老钧瓷的釉比较厚，烧的时候釉在高温下开裂了，但是裂纹周围的釉又慢慢流过来把它"愈合"了，就留下了这种像蚯蚓爬过的痕迹。

这个纹路，仿品做不出来。为什么？因为它需要时间。真正的蚯蚓走泥纹，是釉在 1300 度下缓慢流动形成的，气窑 10 个小时就出窑了，根本来不及形成这种纹路。

所以你以后去文玩店，老板说这是老钧瓷，你翻过来看一眼——有蚯蚓走泥纹的，八成是真东西；釉面光溜溜什么纹路都没有的，你转身就走，不用还价。`],[`神垕古镇·七里长街`,`产地故事`,[`神垕`,`源头`,`信任`],`一座镇子烧了一千年，全世界只此一家`,`瓷友们，你们知道我现在在哪儿给你们直播吗？

河南禹州神垕镇。这个镇子不大，从东头走到西头，七里路。但是这条街两边，全是窑。你走过这条街，每家门口都堆着瓷土、柴火、釉矿石，空气里都是烧窑的烟火味。

这座镇子烧钧瓷，烧了一千年。从宋朝到现在，没有断过。全世界想做钧瓷的，日本、韩国、欧洲，最后都要跑到这里来学。为什么？因为这里的土、这里的水、这里的矿石，别的地方没有。

你拿神垕的土到别的地方去烧，烧出来就不是那个味。这不是玄学，是科学——神垕的孔雀石含铜量就是不一样，配上方解石和紫金土，在松木灰的氛围里烧，出来的釉色就是别人做不出来的。

所以瓷友们，你在咱们直播间买的每一只钧瓷，都是神垕源头直发的。没有中间商，没有文玩店加价，从这条七里长街上的窑口，直接到你手上。`],[`大师的一双手`,`人物故事`,[`传承人`,`手工`,`情感`],`修坯师傅的手，比你的脸还粗糙`,`今天给大家看看我师父的手——（镜头特写手部）

看到没有？这双手，布满了老茧，指关节比正常人的粗一倍，指甲缝里永远有洗不掉的釉土。这双手在修坯台上修了 35 年。

我师父 16 岁开始学修坯。修坯是什么？就是把拉坯机拉出来的粗坯，用一把竹刀修薄、修圆、修出器型。罗汉杯的口沿要多薄？不到 2 毫米。你手稍微抖一下，坯就塌了。

一个学徒，练 3 年才能上正式的修坯台。练 10 年才能修罗汉杯这种薄胎器型。练 20 年，才敢碰赏瓶这种大件。

师父跟我说过一句话："咱们这行，没有天才，只有时间。你坐够了一万个小时，手才会听你的。"

所以瓷友们，你手里端着的这只杯子，不只是泥巴和釉，是一个人 35 年的生命，浓缩在 2 毫米的口沿上。你喝一口茶，就喝的是匠心。`],[`柴烧为什么贵`,`工艺故事`,[`柴烧`,`成本`,`价值`],`一窑柴烧的成本，算给你看`,`瓷友问我：柴烧为什么比气烧贵这么多？今天我把账算给你看。

烧一窑柴烧，需要什么？第一，松木。一窑要用 3 卡车松木，光柴火成本就是 8000 块。第二，时间。要烧三天三夜 72 小时，窑工 7 个人三班倒，人工费又是大几千。第三，松木灰。柴烧的灰会落下来形成自然釉，但是也会让废品率特别高——一窑 80 只坯子，最后能用的不到 15 只。

你算算：8000 柴火 + 5000 人工 + 坯子损耗，一窑光成本就 1 万多，出 15 只，每只光成本就是 700 多。再加上大师手签、证书、顺丰木箱，你说 128 一只贵吗？这真的是赔本在做。

那为什么还要柴烧？因为气窑出来的釉是"死"的，像玻璃；柴窑出来的釉是"活"的，有橘皮、有落灰、有灵气。老玩家一摸就知道。你花 128 买的不是一只杯子，是三天三夜 72 小时和 8000 块柴火的结晶。`],[`钧瓷养壶记`,`养瓷故事`,[`养壶`,`金丝铁线`,`把玩`],`一只杯子养半年，养出金丝铁线`,`给大家讲个真实的事。

去年有个老客户，在我们家买了一只罗汉杯。回去之后，每天用它泡一壶红茶，喝完仔细洗干净，用棉布擦干，就这么养了半年。

有一天他给我发了一张照片——你看（假装展示手机照片），杯子上的开片纹路，全变成了金色的。为什么？因为茶汤里的茶色素，日积月累渗进了开片的缝隙里。红茶养出来的叫"金丝"，普洱养出来的叫"铁线"。

这叫什么？这就叫"金丝铁线"。半年前，这只杯子的开片是白的、细的；半年后，每一条纹路都变成了金色，像一张金色的蜘蛛网铺在杯面上。

这只杯子，半年前卖他 128。现在有人出 800 他不卖。为什么？因为这只杯子里有他半年的时光、半年的茶香。这是他和这只杯子共同养出来的东西，世界上再没有第二只。

瓷友们，钧瓷不是买完就结束了，好器越养越值钱。你今天买的，是未来半年的惊喜。`],[`打碎的赏瓶`,`情感故事`,[`砸瓷`,`匠心`,`催泪`],`一只值三千的赏瓶，为什么当众砸碎`,`给大家讲一件去年发生的事。

去年我们出了一窑赏瓶，出了 30 只，精挑细选留下 12 只。其中有一只，釉色特别漂亮——"雨过天青泛红霞"，三色齐聚，是那一窑的"窑宝"。

本来这只要标价 3000 上直播的。但是上播前一天晚上，师父拿着放大镜看了一个小时，最后叫来窑工说："砸了。"

我们都愣了。师父说："底足这里，有一条暗裂纹。现在看不出来，但是用三年一定会裂开。到时候人家花了 3000 块，用了三年裂了，来找我们，那不光是退钱的事，是砸了咱们窑口三十年的招牌。"

那天晚上，我们当着所有人的面，把这只赏瓶砸了。3000 块，碎了满地。

瓷友们，你问我钧瓷为什么值钱？值钱的不是那只赏瓶，值钱的是砸掉它的那份较真。一只底足有暗裂的赏瓶都不卖给你，你买到的每一只，都是我们替你淘汰掉几十只之后，留下来的最好的那一只。`],[`煤烧的最后一窑`,`稀缺故事`,[`煤烧`,`绝版`,`收藏`],`环保不让烧了，以后再也没有煤烧钧瓷`,`瓷友们，今天这只煤烧赏瓶，我必须跟大家说清楚——这是绝版。

五年前，国家环保要求，煤窑全部停烧。为什么？因为烧煤污染大，一窑煤烧下来，黑烟冒三天。但是现在神垕已经不允许再烧煤了，全部改成了气窑和电窑。

那煤烧和柴烧有什么区别？柴烧是温润，煤烧是浓烈。煤烧出来的釉色更厚重、更沉稳，红就是正红，紫就是深紫，不会有柴烧那种"飘"的感觉。老玩家有句话叫"一煤顶三柴"——一只煤烧的釉色浓度，顶得上三只柴烧。

但是，煤烧没有了。五年前最后一批煤烧的作品，现在市面上一件难求。大师家里封了最后十几只，一直没舍得卖。

今天，老爷子终于松口了，放了 3 只出来。就 3 只。拍完这 3 只，你以后花多少钱都买不到煤烧的钧瓷了。因为能烧煤的人不烧了，会烧煤的人老了。这就是绝版，懂的人都在抢。`],[`钧瓷开片的声音`,`鉴赏故事`,[`开片`,`声音`,`感官`],`半夜开片的声音，像冰面开裂`,`你有没有半夜被钧瓷吓到过？

我有过。第一次是去年冬天，一只新出的柴烧杯放在床头柜上，凌晨两三点，突然"咔"一声，像冰面裂了。我开灯一看——杯子没碎，但釉面上多了一条细细的纹路。

这就是"开片"。

钧瓷出窑之后，釉面和胎体的收缩率不同，会在几天、几个月、甚至几年里持续开裂。你听到的"咔"声，就是开片在生长。老玩家管这叫"瓷在呼吸"。

你买回去之后，养个半年，某天深夜也许也会听到"咔"的一声。别怕，那不是碎了，是这只杯子在你家开始扎根了，它跟你的缘分，正式开始了。`],[`宋徽宗的"雨过天青"`,`文化故事`,[`宋徽宗`,`天青`,`美学`],`一句话定千年美学的皇帝`,`宋徽宗赵佶，是个治国一塌糊涂但审美千古无对的皇帝。

有一天大雨，他站在殿里看雨停。雨停之后，云层裂开一条缝，天光透出来，天空呈现出一种说不清的颜色——不是蓝，不是青，不是灰，是一种温润的、含蓄的、让人心里安静的颜色。

徽宗转头跟身边人说了一句话，只有七个字："雨过天青云破处。"

然后他下令：烧一种瓷，就要这个颜色。

这就成了后来千年里所有窑工的终极追求。汝窑追的是那个"天青"，钧瓷追的是那个"云破处"——云裂开那一瞬间，天光透出来的颜色，紫里泛青，青里透红。

你手里这只杯子，追的就是一千年前那场雨停之后的天空。`],[`老窑工的一日三餐`,`人物故事`,[`窑工`,`日常`,`真实`],`烧窑人的饭碗和酒杯`,`带大家看看我们窑工真实的一天。

早上五点，窑工起来第一件事不是吃饭，是看窑温。昨天晚上填了一茬柴，现在窑里多少度？用眼睛看火色——樱红是 800 度，橘黄是 1000 度，亮黄是 1200 度。看错了，一窑就废了。

早饭很简单，馒头配咸菜，有时候加一碗胡辣汤。吃完接着添柴，一添就是一整天。

中午在窑口蹲着吃碗面，窑口温度四十多度，汗往下淌，但没人喊热——习惯了。

晚上最苦，要守夜。窑里不能断火，一断火温降了，釉面就花了。窑工拿个棉大衣裹着，坐在窑口打盹，两个小时起来添一次柴。

三天三夜之后开窑，那才是最激动的时候。整个窑口的七个人，都围过来，谁也不说话，就看老爷子拿火钳开窑门。

这就是钧瓷人的日常。你手里的杯子，就是这么烧出来的。`],[`钧瓷为什么不能量产`,`工艺故事`,[`手工`,`稀缺`,`价值`],`每一个环节都是手工，每一个环节都是赌`,`有人问我：你们钧瓷这么火，为什么不搞个流水线量产？

我告诉你为什么——因为钧瓷从头到尾，没有一步能用机器。

第一步，练泥。要用禹州本地的黄黏土，人工踩泥排除气泡。机器踩的泥有气泡，烧出来会炸。

第二步，拉坯。一个拉坯师傅一天最多拉 30 只，每一只形状都有细微差别。机器压出来的，一模一样，但没有"手气"，烧出来釉不活。

第三步，修坯。2 毫米的口沿，全靠师傅手感，机器修不了。

第四步，上釉。手工浸釉，每一只釉厚不同，烧出来釉色就不同。

第五步，烧窑。温度、气氛、还原、氧化，全靠窑工眼睛看火色调节，差 10 度就是两个颜色。

每一步都是手工，每一步都是赌。你算算，怎么可能量产？所以钧瓷永远供不应求，永远一器一纹，永远是孤品。`],[`一只杯子的旅行`,`情感故事`,[`茶友`,`传承`,`温暖`],`从窑口到你手里，它经过了多少双手`,`你有没有想过，你手里这只杯子，在到你手上之前，经过了多少双手？

第一双手：矿工。在神垕的矿洞里，把孔雀石、方解石挖出来。粗糙的手，指甲缝里全是矿粉。

第二双手：练泥师傅。把矿石碾碎、淘洗、沉淀、踩泥。这双手泡在泥水里三十年，指关节都比别人粗一倍。

第三双手：拉坯师傅。一团泥在他手里，三分钟变成一只杯子。这双手，灵巧得像弹钢琴。

第四双手：修坯师傅。一把竹刀，把杯子修到 2 毫米薄。这双手，稳得像外科医生。

第五双手：上釉师傅。杯子往釉缸里一浸，提起来，釉厚薄全凭手感。

第六双手：窑工。三天三夜不睡觉，守着窑温。

第七双手：砸瓷师傅。开窑之后，不合格的全部砸掉。

第八双手：大师。在底足签上自己的名字。

然后，它到了你手里。

八双手，几十道工序，三个月时间，才到你面前这一只杯子。你喝茶的时候，慢慢品，品的不只是茶，是这八双手的温度。`],[`钧瓷的颜色密码`,`鉴赏故事`,[`釉色`,`科普`,`必讲`],`红为贵，紫为最，天青天白惹人爱`,`今天教大家看钧瓷的颜色。记住一句话："红为贵，紫为最，天青天白惹人爱。"

红色——是铜元素在还原气氛里呈现的颜色。正红、玫瑰红、海棠红，越纯正越贵。红色的钧瓷最少见，因为铜在高温下极难控制，稍不注意就发黑发灰。

紫色——是铜和铁在特定比例下共同呈色。玫瑰紫、葡萄紫、丁香紫，紫中泛红是最顶级的窑变。古人说"钧瓷万色，紫色为尊"。

天青色——是铁元素在还原气氛里的颜色。雨过天青，温润如玉，最接近宋徽宗那个梦的颜色。

月白色——是铁在氧化气氛里的颜色。白中泛青，像月光洒在瓷器上，含蓄温柔。

你看你手里这只杯子，如果同时有红、紫、青三色，恭喜你——这叫"三色齐聚"，属于窑变上品，市场上可遇不可求。`],[`直播间最贵的杯子`,`情感故事`,[`拍卖`,`天价`,`传奇`],`一只 128 元的杯子，后来拍了 8 万`,`讲个真实的事。

三年前有个瓷友在我们直播间，花了 128 买了一只柴烧罗汉杯。当时那只杯子窑变一般，玫瑰紫里带一点灰，不算特别出彩。但买回去之后，他特别用心养——每天泡红茶，从不间断。

一年之后，开片长出了金丝。两年之后，釉面出现了一种"蛤蜊光"——就是转动杯子，釉面上会泛出七彩的光晕，像蛤蜊壳的内壁一样。

第三年，他把这只杯子发到拍卖行——开价 8 万，当场成交。

128 变 8 万，涨了 625 倍。为什么？因为他养出了"包浆"。钧瓷养出来的包浆，是岁月的痕迹，是茶汤的浸润，是人和器物之间的对话。这种东西，工厂做不出来，金钱买不到。

所以你今天买的不是 128 元的杯子，是一张"时间的彩票"。养得好，三年五年后，它可能回报你十倍百倍。`],[`钧瓷和汝瓷的区别`,`鉴赏故事`,[`对比`,`汝瓷`,`科普`],`宋代五大名窑里最像的两兄弟`,`瓷友总问：钧瓷和汝瓷有什么区别？今天一次讲清。

宋代五大名窑：汝、官、哥、钧、定。钧和汝最容易混，因为它俩都追"天青色"，都是河南的窑口，只隔了几十里路。但区别很大：

第一，釉色。汝瓷是天青一色，纯净温润，像一块玉；钧瓷是窑变多色，一只杯子上有紫有红有青，每只都不一样。

第二，开片。汝瓷的开片是"蟹爪纹"——细密、均匀，像螃蟹爬过的痕迹；钧瓷的开片是"蚯蚓走泥纹"——粗一些、弯一些，像蚯蚓在泥里钻。

第三，釉面。汝瓷的釉是"玛瑙釉"，摸上去滑如凝脂；钧瓷的釉是"橘皮釉"，摸上去有细微的颗粒感。

第四，价格。汝瓷存世极少，一件动辄千万；钧瓷虽然也贵，但直播间还能买到几百块的入门款。

简单说：汝瓷是安静的、内敛的大家闺秀；钧瓷是热烈的、多变的侠女。各有各的美，看你好哪一口。`],[`窑口里的老猫`,`情感故事`,[`窑口`,`温情`,`日常`],`一只在窑口住了十年的猫`,`我们窑口有只猫，叫"窑花"。橘猫，十斤重，在窑口住了快十年。

它有个习惯——每次开窑的时候，它一定蹲在窑门口第一排，比窑工还准时。老爷子开窑门，它就歪着头看；一只一只往外拿，它就跟着一只一只看。

有一次出了一只窑变特别漂亮的杯子，玫瑰紫泛金斑，老爷子刚拿出来放在桌上，窑花"喵"一声跳上去，一爪子把杯子拨到地上了——碎了。

全窑口的人脸都绿了。老爷子愣了三秒，蹲下来摸了摸猫头说："你看不上这只，说明它还不够好。"

然后转头跟我们说："这只碎了，说明这窑还有更好的，继续拿。"

结果下一只，更漂亮——天青泛紫，三色齐聚，成了那一窑的窑宝。

后来窑口的人都信了：窑花拨下来的，都不是最好的；它看上不动的，才是真宝贝。

所以你买钧瓷的时候别纠结，能到你手里的，都是猫替你选过的。`],[`送礼送钧瓷的讲究`,`文化故事`,[`送礼`,`寓意`,`实用`],`为什么钧瓷是送礼天花板`,`快到过节了，很多瓷友来问：送礼送钧瓷有什么讲究？

第一，寓意好。钧瓷的"钧"和"君"同音，送钧瓷就是送"君子之交"。而且钧瓷"入窑一色出窑万彩"，寓意"前程似锦、未来可期"，送领导、送客户、送朋友，寓意都对。

第二，独一无二。每只钧瓷釉色都不同，你送出去的那只，全世界没有第二只一模一样的。这比送烟酒茶有面子得多——烟酒是可以用钱买到的，钧瓷是用缘分遇到的。

第三，越用越值钱。烟酒抽了喝了就没了，钧瓷越养越润、越养越美，十年后还在，还更贵。

第四，有文化。送钧瓷附一张收藏证书 + 一段故事（比如宋徽宗的梦），收礼的人打开就觉得有文化、有品位、有分量。
